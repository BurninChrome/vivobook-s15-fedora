# Public identity of the project: the ONLY place to set it.
# Fill in the three values, then run: tools/set-identity.sh
# The script replaces the tokens @OWNER@, @AUTHOR@ and @AUTHOR_EMAIL@ in all
# files and sets the local git author. Kernel patches need a real name in
# Signed-off-by (DCO), so AUTHOR should be the name used there.

# GitHub account or organization that owns the repository and the COPR project
OWNER=BurninChrome
# Maintainer name (copyright, RPM changelog, patch authorship)
AUTHOR=Kacper Goc
# Public e-mail (e.g. the GitHub noreply address)
AUTHOR_EMAIL=11682528+BurninChrome@users.noreply.github.com
