# Hide the raw CAMSS video nodes (msm_vfe*_video*) from WirePlumber's V4L2
# monitor. The camera is offered by the libcamera monitor instead (pipeline
# "simple" with the software ISP); the raw nodes give no picture without a
# configured media pipeline and only clutter the camera lists of apps.
# System-wide: /usr/share/wireplumber/wireplumber.conf.d/ (installed by the
# package). Per user: ~/.config/wireplumber/wireplumber.conf.d/, then
#   systemctl --user restart wireplumber
monitor.v4l2.rules = [
  {
    matches = [
      { api.v4l2.cap.driver = "qcom-camss" }
    ]
    actions = {
      update-props = {
        device.disabled = true
        node.disabled = true
      }
    }
  }
]
