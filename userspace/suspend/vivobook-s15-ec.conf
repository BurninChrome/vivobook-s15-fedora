# /etc/modprobe.d/vivobook-s15-ec.conf
# Let qcom-hamoa-ec allow system suspend. On suspend the driver sends the EC
# "modern standby enter" (23 01) and on resume "modern standby exit" (23 00),
# as Windows does; this stops the EC's SoC Tj watchdog while the SoC sleeps.
# Needs kernel patches 0401-0411 (0411: the Tj feed always restarts on resume).
options qcom_hamoa_ec allow_suspend=1
