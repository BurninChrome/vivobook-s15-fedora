# Lightweight checks only. RPMs are built in Fedora COPR, not here.
name: ci
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    container: registry.fedoraproject.org/fedora:45
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: dnf -y install dtc ShellCheck git-core xz reuse
      - name: ShellCheck
        run: shellcheck -S warning tools/*.sh hooks/apply-dtb hooks/apply-ucm hooks/lpass-rpm-on hooks/30-vivobook-s15.install overlay/*.sh packaging/kernel/*.sh userspace/*/*.sh image/*.sh image/dnf-retry
      - name: REUSE compliance
        run: reuse lint
      - name: Privacy scan (fails on any hit outside the allow list)
        run: tools/scan-private.sh -x .scan-private-allow -o scan.txt . || { cat scan.txt; exit 1; }

  overlay:
    runs-on: ubuntu-24.04-arm
    container: registry.fedoraproject.org/fedora:45
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: dnf -y install dtc cpp make python3 kernel-core
      - name: Build overlays and apply them to the stock DTB
        run: |
          STOCK=$(ls /usr/lib/modules/*/dtb/qcom/x1e80100-asus-vivobook-s15.dtb | head -1)
          STOCK_DTB="$STOCK" make check

  # Builds the Silverblue image with the stock kernel and WITHOUT firmware or
  # logo (none of them may be redistributed). Checks the Containerfile, the
  # UKI/DTB merge, Howdy, initramfs and bootc lint. The image is not pushed.
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
      - name: Build
        run: |
          sudo image/build.sh --no-firmware --ec yes --tag localhost/vivobook-s15-silverblue:ci
      - name: Inspect
        run: |
          sudo podman run --rm localhost/vivobook-s15-silverblue:ci sh -c '
            k=$(ls /usr/lib/modules); echo "kernel $k"
            test -s /usr/lib/modules/$k/devicetree
            python3 /usr/libexec/vivobook-s15/patch-vmlinuz-dtb.py --verify --vmlinuz /usr/lib/modules/$k/vmlinuz
            grep -q ASUS-Vivobook-S15.conf /usr/share/alsa/ucm2/Qualcomm/x1e80100/x1e80100.conf
            cat /usr/lib/bootc/kargs.d/10-vivobook-s15.toml'

  patches:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Check that the series applies to the upstream base
        run: |
          . packaging/kernel/BASE
          git init linux && cd linux
          git fetch --depth 1 https://github.com/torvalds/linux.git "$UPSTREAM_COMMIT"
          git checkout FETCH_HEAD
          while read -r p; do
            case "$p" in ''|'#'*) continue ;; esac
            git apply --check "../kernel/patches/$p" && git apply "../kernel/patches/$p"
          done < ../kernel/patches/series
