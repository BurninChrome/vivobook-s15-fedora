name: Hardware report
description: Tell us how this project works on your Vivobook S 15
labels: ["hardware-report"]
body:
  - type: markdown
    attributes:
      value: |
        Run `tools/collect-hwinfo.sh` and paste the output below. Read it first:
        do not post serial numbers, MAC addresses, network names or photos.
  - type: dropdown
    id: model
    attributes:
      label: Model
      options: ["S5507QAD", "S5507QA", "other (write below)"]
    validations: { required: true }
  - type: input
    id: bios
    attributes:
      label: BIOS version
      placeholder: "S5507QAD.367"
    validations: { required: true }
  - type: input
    id: kernel
    attributes:
      label: Kernel (uname -r)
    validations: { required: true }
  - type: dropdown
    id: firmware
    attributes:
      label: Firmware source
      options: ["tools/fetch-firmware.sh (ASUS BSP)", "qcom-firmware-extract (Windows partition)", "other"]
    validations: { required: true }
  - type: checkboxes
    id: works
    attributes:
      label: What works
      options:
        - label: Battery and charging
        - label: Speakers
        - label: Headphones
        - label: Internal microphones
        - label: Front camera
        - label: IR camera / Howdy
        - label: Fan control (EC driver loaded)
        - label: Suspend and resume
        - label: Wi-Fi stable for a day
        - label: HDMI / DisplayPort
  - type: textarea
    id: hwinfo
    attributes:
      label: Output of tools/collect-hwinfo.sh
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Notes
