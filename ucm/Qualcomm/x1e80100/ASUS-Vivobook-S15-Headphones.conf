# Headphone playback for the ASUS Vivobook S 15 (X1E80100): the WCD9385
# headphone output on hw:<card>,0 (MultiMedia1).
#
# Separate verb on purpose, see ASUS-Vivobook-S15-Speaker.conf.
#
# HPHL/HPHR Volume is a line_gain control: -30 dB .. +6 dB in 1.5 dB steps,
# so 20 = 0 dB (upstream T14s value) and 16 = -6 dB.  The desktop mixer covers
# the rest of the range.
#
# No JackControl: the jack pins are CARD interface controls
# (numid=137 'Headphone Jack', 136 'Mic Jack') while UCM resolves JackControl
# through the MIXER interface, so it never resolves - measured, plugging
# headphones never switched anything.

SectionVerb {
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='MultiMedia4 Mixer VA_CODEC_DMA_TX_0' 1"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	Include.wcdhpe.File "/codecs/wcd938x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd938x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	EnableSequence [
		cset "name='HPHL Volume' 16"
		cset "name='HPHR Volume' 16"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}

# Capture devices.  Identical in both verbs (Speaker and Headphones), so the
# microphones work whichever output profile is active.
# The FE->BE switches (MultiMedia3/4 Mixer) live in SectionVerb, as in the
# upstream T14s profile: ACP opens every capture PCM while probing a verb, and
# an unconnected FE fails with EINVAL, which drops the whole profile.
#
# Internal mics: a DMIC pair on the SoC PDM lines (dmic01), read by the LPASS
# VA macro on hw:<card>,3 (MultiMedia4 <- VA_CODEC_DMA_TX_0).  Bias comes from
# WCD9385 MIC BIAS3 through the DT routing; DMIC2..7 are not populated.

SectionDevice."Mic" {
	Comment "Internal microphones"

	Include.vadm0e.File "/codecs/qcom-lpass/va-macro/DMIC0EnableSeq.conf"
	Include.vadm0d.File "/codecs/qcom-lpass/va-macro/DMIC0DisableSeq.conf"
	Include.vadm1e.File "/codecs/qcom-lpass/va-macro/DMIC1EnableSeq.conf"
	Include.vadm1d.File "/codecs/qcom-lpass/va-macro/DMIC1DisableSeq.conf"

	Value {
		CapturePriority 100
		CaptureChannels 2
		CapturePCM "hw:${CardId},3"
	}
}

# Headset mic: WCD9385 AMIC2 (ADC2, MIC BIAS2) over SoundWire to the TX macro,
# hw:<card>,2 (MultiMedia3 <- TX_CODEC_DMA_TX_3).  ADC2 Volume 10 (+15 dB) as
# in the upstream T14s BootSequence; PipeWire drives ADC2 from there.

SectionDevice."Headset" {
	Comment "Headset microphone"

	Include.wcdmice.File "/codecs/wcd938x/HeadphoneMicEnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd938x/HeadphoneMicDisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/SoundwireMic1EnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	EnableSequence [
		cset "name='ADC2 Volume' 10"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC2"
		JackControl "Mic Jack"
	}
}
